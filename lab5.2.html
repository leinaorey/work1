<html>
<head>
    <script>
    var timer = null;

    function randColor() {
        var useR = document.getElementById("useR").checked;
        var useG = document.getElementById("useG").checked;
        var useB = document.getElementById("useB").checked;
        var r = useR ? Math.floor(Math.random() * 256) : 0;
        var g = useG ? Math.floor(Math.random() * 256) : 0;
        var b = useB ? Math.floor(Math.random() * 256) : 0;
        return "rgb(" + r + "," + g + "," + b + ")";
    }

    function drawRandomRect() {
        var canvas = document.getElementById("canvas");
        var ctx = canvas.getContext("2d");
        var w = 20 + Math.floor(Math.random() * 60);
        var h = 20 + Math.floor(Math.random() * 60);
        var x = Math.floor(Math.random() * (canvas.width - w));
        var y = Math.floor(Math.random() * (canvas.height - h));
        ctx.fillStyle = randColor();
        ctx.fillRect(x, y, w, h);
    }

    function startRandom() {
        if (timer) return;
        var speed = parseInt(document.getElementById("speed").value, 10);
        if (speed < 50) speed = 50;
        timer = setInterval(drawRandomRect, speed);
    }

    function stopRandom() {
        clearInterval(timer);
        timer = null;
    }

    function clearRandom() {
        stopRandom();
        var canvas = document.getElementById("canvas");
        var ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    </script>
</head>
<body>
    <label>Компоненты RGB:</label>
    <input type="checkbox" id="useR" checked/> R
    <input type="checkbox" id="useG" checked/> G
    <input type="checkbox" id="useB" checked/> B
    <br>
    <label>Скорость (мс):</label><input type="number" id="speed" value="300" min="50" max="3000"/>
    <br><br>
    <input type="button" value="Старт" onclick="startRandom()"/>
    <input type="button" value="Стоп" onclick="stopRandom()"/>
    <input type="button" value="Очистить" onclick="clearRandom()"/>
    <br><br>
    <canvas id="canvas" width="400" height="300" style="border:1px solid #333"></canvas>
</body>
</html>
